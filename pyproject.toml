[project]
name = "openai-responses-conversation-api"
version = "0.1.0"
description = "Python examples for the OpenAI Responses and Conversations APIs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.2",
    "jsonify>=0.5",
    "openai>=3.8.0,<4",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.47",
    "uuid-utils>=0.14.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: makes real, billable requests to external APIs",
]
